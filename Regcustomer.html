<!DOCTYPE html>
<html>
<head>
    <title>Customer Registration Form</title>
</head>
<body>
 
<h1>Customer Registration Form</h1>
<p>Register as a customer of the Event Management System.</p>
 
<form>
 
    <fieldset>
        <legend>Personal Information</legend>
 
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>
 
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="example@email.com" required><br><br>
 
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX" required><br><br>
 
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>
 
        <label>Gender:</label><br>
 
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
 
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
 
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>
 
        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="3" cols="30" placeholder="Enter your address"></textarea><br><br>
 
    </fieldset>
 
    <br>
 
    <fieldset>
        <legend>Account Information</legend>
 
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" placeholder="Choose a username" required><br><br>
 
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
 
        <label for="confirm">Confirm Password:</label><br>
        <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" required><br><br>
 
    </fieldset>
 
    <br>
 
    <fieldset>
        <legend>Event Preferences</legend>
 
        <label for="city">Preferred City:</label><br>
 
        <select id="city" name="city">
            <option value="">Select City</option>
            <option value="Dhaka">Dhaka</option>
            <option value="Chittagong">Chittagong</option>
            <option value="Sylhet">Sylhet</option>
            <option value="Rajshahi">Rajshahi</option>
            <option value="Other">Other</option>
        </select><br><br>
 
        <label>Preferred Event Type:</label><br>
 
        <input type="radio" id="wedding" name="eventtype" value="Wedding">
        <label for="wedding">Wedding</label><br>
 
        <input type="radio" id="concert" name="eventtype" value="Concert">
        <label for="concert">Concert</label><br>
 
        <input type="radio" id="conference" name="eventtype" value="Conference">
        <label for="conference">Conference</label><br>
 
        <input type="radio" id="birthday" name="eventtype" value="Birthday">
        <label for="birthday">Birthday Party</label><br><br>
 
        <label for="guests">Number of Guests:</label><br>
        <input type="number" id="guests" name="guests" min="1" placeholder="e.g. 100"><br><br>
 
        <label for="budget">Budget Range:</label><br>
 
        <select id="budget" name="budget">
            <option value="">Select Budget Range</option>
            <option value="Below 50000">Below 50,000 BDT</option>
            <option value="50000-100000">50,000 - 100,000 BDT</option>
            <option value="100000-300000">100,000 - 300,000 BDT</option>
            <option value="Above 300000">Above 300,000 BDT</option>
        </select><br><br>
 
        <label>Interests:</label><br>
 
        <input type="checkbox" id="music" name="interests" value="Music">
        <label for="music">Music</label><br>
 
        <input type="checkbox" id="food" name="interests" value="Food">
        <label for="food">Food</label><br>
 
        <input type="checkbox" id="sports" name="interests" value="Sports">
        <label for="sports">Sports</label><br><br>
 
    </fieldset>
 
    <br>
 
    <input type="checkbox" id="terms" name="terms" required>
    <label for="terms">I agree to the terms and conditions.</label><br><br>
 
    <input type="submit" value="Register">
    <input type="reset" value="Clear Form">
 
</form>
 
</body>
</html>
